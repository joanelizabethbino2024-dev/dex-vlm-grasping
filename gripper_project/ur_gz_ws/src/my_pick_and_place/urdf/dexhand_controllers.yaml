      - R_Index_Pitch
      - R_Middle_Pitch
      - R_Ring_Pitch
      - R_Pinky_Pitch
      - R_Index_Flexor
      - R_Middle_Flexor
      - R_Ring_Flexor
      - R_Pinky_Flexor
      - R_Index_DIP
      - R_Middle_DIP
      - R_Ring_DIP
      - R_Pinky_DIP
      - R_Thumb_Yaw
      - R_Thumb_Roll
      - R_Thumb_Flexor
